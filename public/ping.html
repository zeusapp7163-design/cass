<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Диагностика загрузки — casinotop.app</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #06070c;
        color: #e9edf6;
        font: 14px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 18px;
        color: #98a1b8;
      }
      pre {
        background: #0d1019;
        border: 1px solid #232838;
        border-radius: 12px;
        padding: 14px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font: 12px/1.5 ui-monospace, Consolas, monospace;
      }
      .ok {
        color: #34d399;
      }
      .bad {
        color: #fb7185;
      }
      .run {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        font: 600 14px/1 -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        background: linear-gradient(120deg, #8b5cf6, #6366f1 55%, #22d3ee);
        cursor: pointer;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Диагностика загрузки</h1>
    <p>Страница проверяет, что именно доходит до браузера с вашего канала.</p>
    <button class="run" id="run">Проверить</button>
    <div id="out"><pre>нажми «Проверить»…</pre></div>

    <script>
      (function () {
        var out = document.getElementById('out');

        function line(label, ok, text) {
          return (
            '<span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'OK  ' : 'FAIL') + '</span> ' +
            label + ' — ' + text + '\n'
          );
        }

        function fmt(ms, bytes) {
          return (bytes != null ? bytes + ' байт, ' : '') + ms + ' мс';
        }

        async function probe(label, url, asText) {
          var t0 = performance.now();
          try {
            var ctrl = new AbortController();
            var timer = setTimeout(function () { ctrl.abort(); }, 25000);
            var res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
            var body = asText ? await res.text() : await res.arrayBuffer();
            clearTimeout(timer);
            var size = asText ? body.length : body.byteLength;
            var ok = res.ok;
            return { html: line(label, ok, 'HTTP ' + res.status + ', ' + fmt(Math.round(performance.now() - t0), size)), ok: ok, text: asText ? body : null };
          } catch (e) {
            return { html: line(label, false, e.name + ': ' + e.message + ' (' + Math.round(performance.now() - t0) + ' мс)'), ok: false };
          }
        }

        function probeImg(url) {
          return new Promise(function (resolve) {
            var t0 = performance.now();
            var img = new Image();
            img.onload = function () { resolve({ html: line('картинка ' + url, true, img.naturalWidth + 'x' + img.naturalHeight + ', ' + Math.round(performance.now() - t0) + ' мс') }); };
            img.onerror = function () { resolve({ html: line('картинка ' + url, false, 'не загрузилась (' + Math.round(performance.now() - t0) + ' мс)') }); };
            img.src = url;
          });
        }

        document.getElementById('run').addEventListener('click', async function () {
          out.innerHTML = '<pre>проверяю…</pre>';
          var lines = [];
          lines.push('агент: ' + navigator.userAgent);
          lines.push('канал: ' + (navigator.connection && navigator.connection.effectiveType ? navigator.connection.effectiveType : 'н/д') + ', saveData: ' + (navigator.connection && navigator.connection.saveData));
          lines.push('');

          var root = await probe('HTML главной', '/', true);
          lines.push(root.html);
          if (root.text) {
            lines.push('     начинается с: ' + root.text.slice(0, 60).replace(/\s+/g, ' '));
            lines.push('     заканчивается на </html>: ' + (root.text.trimEnd().endsWith('</html>') ? 'да' : 'НЕТ — ответ обрезан'));
            lines.push('     есть футер: ' + (root.text.indexOf('Играйте ответственно') !== -1 ? 'да' : 'НЕТ'));
            lines.push('     есть слоты: ' + (root.text.indexOf('Популярные слоты') !== -1 ? 'да' : 'НЕТ'));
          }

          var cssMatch = root.text && root.text.match(/\/_next\/static\/[^"']+\.css/);
          var jsMatch = root.text && root.text.match(/\/_next\/static\/[^"']+\.js/);

          var assets = await Promise.all([
            cssMatch ? probe('CSS сайта', cssMatch[0], false) : Promise.resolve({ html: line('CSS сайта', false, 'ссылка не найдена в HTML') }),
            jsMatch ? probe('JS сайта', jsMatch[0], false) : Promise.resolve({ html: line('JS сайта', false, 'ссылка не найдена в HTML') }),
            probe('sitemap.xml', '/sitemap.xml', true),
            probe('robots.txt', '/robots.txt', true),
            probe('лого 1win', '/images/casinos/1win.webp', false),
            probe('слот gates-of-olympus', '/images/slots/gates-of-olympus.webp', false),
            probe('og.png (173 КБ)', '/og.png', false),
          ]);
          assets.forEach(function (a) { if (a.html) lines.push(a.html); });

          var imgs = await Promise.all([probeImg('/images/casinos/1win.webp'), probeImg('/images/slots/gates-of-olympus.webp')]);
          imgs.forEach(function (i) { lines.push(i.html); });

          lines.push('');
          lines.push('сообщите эти строки разработчику');
          out.innerHTML = '<pre>' + lines.join('\n') + '</pre>';
        });
      })();
    </script>
  </body>
</html>
